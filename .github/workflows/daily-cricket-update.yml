name: Daily Cricket Update

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-cricket-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Verify OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Missing OPENAI_API_KEY repository secret"
            exit 1
          fi

      - name: Update cricket content with Codex
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          codex --search --ask-for-approval never exec \
            --model gpt-5.3-codex \
            --sandbox workspace-write \
            --cd "$GITHUB_WORKSPACE" \
            --output-last-message "$RUNNER_TEMP/codex-cricket-summary.txt" \
            - < .github/prompts/daily-cricket-update.md

      - name: Run BOBI safety guard
        run: bash .github/scripts/guard-daily-cricket-update.sh

      - name: Commit and push changes
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No cricket changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cricket.json index.php page-template.php blog/index.php sitemap.xml assets/img/articles
          find . -mindepth 2 -maxdepth 2 -type f -path './*-vs-*/index.php' -print0 | xargs -0 -r git add --
          git commit -m "Daily cricket content update"
          git push
